name: Release

# Pushes to main let Release Please maintain a release PR. Merging that PR tags the
# version and creates the GitHub release; the package job then attaches the notarized
# DMG, checksum and Sparkle appcast, and updates the Homebrew cask.
# Pipeline overview: docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and re-upload (for example v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # A personal access token, so CI runs on the release PR and the tag.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Sign, notarize and publish
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
      SPARKLE_VERSION: 2.10.0
      SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/tabnax-release.keychain-db"
          password="$(openssl rand -base64 32)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "TABNAX_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - run: xcodebuild -version

      - name: Build, sign, notarize and package
        id: package
        env:
          TABNAX_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TABNAX_EXPECTED_VERSION: ${{ env.VERSION }}
          TABNAX_NOTARIZE: "1"
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./macos/scripts/release.sh

      - name: Install checksum-verified Sparkle tools
        run: |
          archive="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - -p "$DMG")"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          python3 macos/scripts/release_metadata.py appcast --version "$VERSION" \
            --length "$(stat -f %z "$DMG")" --signature "$signature" \
            --notes-file "$RUNNER_TEMP/notes.md" --output "$RUNNER_TEMP/appcast.xml" \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          # Tabnax.dmg gives the website a stable releases/latest/download/Tabnax.dmg link.
          cp "$DMG" "$RUNNER_TEMP/Tabnax.dmg"
          gh release upload "$TAG" "$DMG" "$DMG.sha256" "$RUNNER_TEMP/Tabnax.dmg" "$RUNNER_TEMP/appcast.xml" --clobber

      - name: Update Homebrew cask
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${RELEASE_TOKEN}@github.com/danmartuszewski/homebrew-tap.git" "$tap"
          python3 macos/scripts/release_metadata.py cask --version "$VERSION" \
            --sha256 "$(shasum -a 256 "$DMG" | cut -d' ' -f1)" --output "$tap/Casks/tabnax.rb" \
            --repository "$GITHUB_REPOSITORY"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tabnax.rb
          git diff --cached --quiet && exit 0
          git commit -m "Updated tabnax to $VERSION"
          git push origin HEAD

      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${RELEASE_KEYCHAIN:-}" ]] && security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"
